<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>My Calculator</h1>

        <input type="text">

        <div class="buttons">

            <button>C</button>
            <button>⌫</button>
            <button>%</button>
            <button>/</button>
            <button>*</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>.</button>

            <button>0</button>
            <button>=</button>

        </div>

    </div>
<script src="script.js"></script>
</body>
</html>
